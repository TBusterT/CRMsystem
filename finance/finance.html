<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Pro - Фінанси та Звіти</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../main/main.css">
    <link rel="stylesheet" href="finance.css">
</head>
<body>
<div class="dashboard-container">

    <aside class="sidebar">
        <div class="logo-area">
            <div class="logo-icon"><i class="fa-solid fa-table-columns"></i></div>
            <div class="logo-text">
                <h1>CRM Pro</h1>
                <span>v2.1.0</span>
            </div>
        </div>

        <nav class="menu">
            <p class="menu-label">Меню</p>
            <a href="../main/index.html" class="menu-item">
                <div class="item-icon blue-icon"><i class="fa-solid fa-house"></i></div>
                <span>Головна</span>
            </a>
            <a href="../clients/clients.html" class="menu-item">
                <div class="item-icon green-icon"><i class="fa-solid fa-users"></i></div>
                <span>Клієнти</span>
            </a>
            <a href="../inbox/inbox.html" class="menu-item">
                <div class="item-icon" style="background-color: #0ea5e9;"><i class="fa-solid fa-message"></i></div>
                <span>Повідомлення</span>
            </a>
            <a href="../inventory/inventory.html" class="menu-item">
                <div class="item-icon purple-icon"><i class="fa-solid fa-box"></i></div>
                <span>Товари</span>
            </a>
            <a href="finance.html" class="menu-item active">
                <div class="item-icon" style="background-color: #f59e0b;"><i class="fa-solid fa-wallet"></i></div>
                <span>Фінанси</span>
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <div class="header-title">
                <h2>Фінанси та Звіти</h2>
                <span class="divider">|</span>
                <span class="last-update">Аналітика грошових потоків</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn"><i class="fa-regular fa-bell"></i></button>
                <button class="profile-btn"><i class="fa-solid fa-user"></i></button>
            </div>
        </header>

        <section class="chart-section fade-in-card">
            <div class="chart-header">
                <h3>📊 Статистика доходів та витрат</h3>
            </div>
            <div class="chart-container" style="height: 250px;">
                <canvas id="financeChart"></canvas>
            </div>
        </section>

        <section class="transactions-section fade-in-card" style="animation-delay: 0.2s;">
            <div class="section-header flex-between">
                <h3>Останні транзакції</h3>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Пошук за описом...">
                </div>
            </div>

            <div class="table-container">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Опис операції</th>
                        <th>Категорія</th>
                        <th>Сума</th>
                        <th>Тип</th>
                    </tr>
                    </thead>
                    <tbody id="table-body">
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script src="finance.js"></script>
</body>
</html>
